name: desktop-release

permissions:
  contents: write

# Simple release: push a tag like `desktop-v1.0.0` and CI builds installers for all three hosts.
# Signing is OPTIONAL — add the secrets below whenever you want signed artifacts; without them the
# release still publishes (macOS: right-click → Open).

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies and test
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Linux system dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libpulse-dev debsigs

      # Secrets can't be used in `if:` directly, so expose a simple flag. Missing secrets only warn.
      - name: Detect optional signing credentials
        id: signing
        shell: bash
        env:
          MAC_CERT: ${{ secrets.DUOSUB_CERT_P12 }}
          MAC_IDENTITY: ${{ secrets.DUOSUB_SIGN_IDENTITY }}
          WIN_PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
          LINUX_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          ready=0
          case "${{ matrix.target }}" in
            macos)   [ -n "$MAC_CERT" ] && [ -n "$MAC_IDENTITY" ] && ready=1 ;;
            windows) [ -n "$WIN_PFX" ] && ready=1 ;;
            linux)   [ -n "$LINUX_KEY" ] && ready=1 ;;
          esac
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" -ne 1 ]; then
            echo "::warning::No signing credentials for ${{ matrix.target }} — publishing unsigned artifacts."
          fi

      - name: Import Developer ID certificate (optional, macOS)
        if: matrix.target == 'macos' && steps.signing.outputs.ready == '1'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DUOSUB_CERT_P12 }}
          p12-password: ${{ secrets.DUOSUB_CERT_PASSWORD }}

      - name: Build macOS DMG
        if: matrix.target == 'macos'
        env:
          DUOSUB_SIGN_IDENTITY: ${{ secrets.DUOSUB_SIGN_IDENTITY }}
          DUOSUB_NOTARY_PROFILE: ${{ secrets.DUOSUB_NOTARY_PROFILE }}
        run: bash scripts/build-desktop.sh

      - name: Build Windows MSI + NSIS
        if: matrix.target == 'windows'
        working-directory: desktop
        run: npm run tauri build

      - name: Authenticode-sign Windows installers (optional)
        if: matrix.target == 'windows' && steps.signing.outputs.ready == '1'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $files = Get-ChildItem -Path desktop/src-tauri/target/release/bundle -Recurse -Include *.msi, *.exe | ForEach-Object { $_.FullName }
          ./scripts/sign-windows.ps1 -Artifacts $files

      - name: Build Linux DEB + AppImage
        if: matrix.target == 'linux'
        working-directory: desktop
        run: npm run tauri build

      - name: GPG-sign Linux packages (optional)
        if: matrix.target == 'linux' && steps.signing.outputs.ready == '1'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_FINGERPRINT: ${{ secrets.LINUX_GPG_FINGERPRINT }}
        run: bash scripts/sign-linux.sh

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
