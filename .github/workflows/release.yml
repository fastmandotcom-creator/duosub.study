name: release

# Tag a version (git push origin v0.1.0) to build release binaries for every platform.
# install.sh downloads the assets attached to the GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The sherpa native crates need a recent SDK (apple-metal uses MTLLogState / MTLSampler-
          # ReductionMode), so the build must run on a macOS 26 image with Xcode 26+.
          - os: macos-26
            asset: duosub-bridge-macos-arm64.app.zip
            target: aarch64-apple-darwin
          - os: macos-26
            asset: duosub-bridge-macos-x64.app.zip
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install native build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config

      - name: Stamp the release tag as the package version (health reports the tag, not 0.1.0)
        if: runner.os == 'macOS'
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          if [ -n "$V" ] && [ "$V" != "0.1.0" ]; then
            sed -i.bak "s/^version = \"0\.1\.0\"/version = \"$V\"/" bridge/Cargo.toml
            rm -f bridge/Cargo.toml.bak
            grep '^version' bridge/Cargo.toml
          fi

      - name: Build
        working-directory: bridge
        env:
          DUOSUB_AUTODOWNLOAD: '1'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect (macOS app bundle)
        if: runner.os == 'macOS'
        env:
          DUOSUB_SIGNING_P12: ${{ secrets.DUOSUB_SIGNING_P12 }}
          DUOSUB_SIGNING_PASSWORD: ${{ secrets.DUOSUB_SIGNING_PASSWORD }}
        run: |
          # macOS attributes system-audio capture (ScreenCaptureKit) to the BUNDLE identity and
          # gates it behind TCC. A bare CLI binary has no bundle id, so it can never obtain the
          # Screen Recording grant — it would silently capture nothing. Therefore the release ships
          # a real .app bundle; the LaunchAgent runs the binary inside it.
          APP="dist/pkg/DuoSub Bridge.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp bridge/target/${{ matrix.target }}/release/duosub-bridge "$APP/Contents/MacOS/"
          find "$HOME/Library/Caches/sherpa-rs" -name 'libonnxruntime*.dylib' -exec cp {} "$APP/Contents/MacOS/" \; 2>/dev/null || true
          find "$HOME/Library/Caches/sherpa-rs" -name 'libsherpa-onnx-c-api.dylib' -exec cp {} "$APP/Contents/MacOS/" \; 2>/dev/null || true
          # @loader_path finds the bundled dylibs; /usr/lib/swift finds the system Swift runtime.
          install_name_tool -add_rpath @loader_path -add_rpath /usr/lib/swift "$APP/Contents/MacOS/duosub-bridge"
          for lib in "$APP/Contents/MacOS"/libonnxruntime*.dylib "$APP/Contents/MacOS"/libsherpa-onnx-c-api.dylib; do
            [ -e "$lib" ] || continue
            install_name_tool -id "$(basename "$lib")" "$lib" 2>/dev/null || true
          done
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>study.duosub.bridge</string>
            <key>CFBundleName</key><string>DuoSub Bridge</string>
            <key>CFBundleDisplayName</key><string>DuoSub Bridge</string>
            <key>CFBundleExecutable</key><string>duosub-bridge</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>LSUIElement</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>DuoSub Bridge transcribes audio on this Mac for on-device captions.</string>
            <key>NSScreenCaptureUsageDescription</key><string>DuoSub Bridge captures system audio so it can create live captions on this Mac.</string>
          </dict>
          </plist>
          PLIST
          # Never ad-hoc. Ad-hoc changes cdhash every release and macOS drops Screen Recording.
          # CI must import the SAME certificate used for every previous release.
          if [ -z "${DUOSUB_SIGNING_P12:-}" ]; then
            echo "FATAL: refusing to publish an ad-hoc build." >&2
            echo "Set secret DUOSUB_SIGNING_P12 (base64 of ~/.duosub/signing/identity.p12) and DUOSUB_SIGNING_PASSWORD." >&2
            echo "A Developer ID certificate is preferred when one exists; the requirement is a stable identity, not a new one per commit." >&2
            exit 1
          fi
          echo "$DUOSUB_SIGNING_P12" | base64 -d > /tmp/duosub-signing.p12
          security create-keychain -p "$DUOSUB_SIGNING_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$DUOSUB_SIGNING_PASSWORD" build.keychain
          security import /tmp/duosub-signing.p12 -k build.keychain -P "$DUOSUB_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$DUOSUB_SIGNING_PASSWORD" build.keychain
          DUOSUB_SIGN_IDENTITY="DuoSub Bridge Signing" bash scripts/sign-bridge.sh "$APP"
          rm -f /tmp/duosub-signing.p12
          # HARD GATE: the ASR runtime dylibs MUST be bundled, else dyld refuses to load the binary
          # ("Library not loaded: libonnxruntime...") and the only user-visible symptom is a dead
          # bridge after install. System Swift/objc dylibs resolve via the /usr/lib/swift rpath we
          # added above — those are NOT bundled and are fine. So we assert exactly the two third-party
          # runtimes that the copy step above is responsible for providing.
          BINX="$APP/Contents/MacOS/duosub-bridge"
          MISSING=0
          for required in "libonnxruntime" "libsherpa-onnx-c-api"; do
            if ! ls "$APP/Contents/MacOS"/${required}*.dylib >/dev/null 2>&1; then
              echo "FATAL: $BINX needs ${required}*.dylib but it is not bundled" >&2
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "Bundle ASR-dependency check passed: $(ls "$APP/Contents/MacOS"/*.dylib 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"

          # Ship the .dmg as the SINGLE user-facing artifact.
          # install.sh (downloaded from the release asset "install.sh") attaches this same .dmg
          # with hdiutil and copies the .app out — one build, one provenance, no fork.
          # The DMG volume = the .app + a symlink to /Applications so a double-click user can
          # drag the app in (no shell, but that path does NOT register the LaunchAgent; the
          # auto-start still needs install.sh once, which the release notes say plainly).
          ARCH_SHORT=${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x64' }}
          DMG_NAME="DuoSub-Bridge-${ARCH_SHORT}.dmg"
          STAGE="dist/pkg-staging"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DuoSub Bridge" -srcfolder "$STAGE" -ov -format UDZO "dist/$DMG_NAME"
          rm -rf "$STAGE"
          echo "Built DMG: dist/$DMG_NAME ($(du -h "dist/$DMG_NAME" | awk '{print $1}'))"

          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/DuoSub-Bridge-${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x64' }}.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The installer ships WITH the release: the script and the binaries it installs are always
      # the same version, served from immutable release assets (raw/main can be mid-push + cached).
      - run: mkdir -p assets && cp install.sh assets/install.sh

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**
          generate_release_notes: true
          body: |
            ## Install (macOS)

            **Path A — One command (default, recommended):**
            ```bash
            curl -fsSL https://github.com/fastmandotcom-creator/duosub.study/releases/latest/download/install.sh | bash
            ```
            This is the single end-user entry point: downloads the `.dmg`, attaches it with
            `hdiutil`, copies **DuoSub Bridge.app** into /Applications, registers the LaunchAgent
            (auto-start), nudges TCC to open the right System Settings pane, and waits for
            `/health`. ONE command. ONE artifact.

            **Path B — No shell (fallback):**
            1. Download the `DuoSub-Bridge-<arch>.dmg` asset above (arm64 = Apple Silicon, x64 = Intel).
            2. Open it, drag **DuoSub Bridge.app** into **Applications** (the DMG has an Applications shortcut).
            3. **Auto-start is NOT registered by the DMG** — to enable it, run the Path A command
               once (or manually run `launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.duosub.bridge.plist`).
            4. Grant **Screen & System Audio Recording** once (System Settings → Privacy & Security) if prompted.

            Why two paths? Path A is the only one that gives auto-start + the "ONE TOGGLE LEFT"
            permission prompt in a single shot. Path B exists for the "my Terminal is blocked by
            MDM" case — it installs the app, but the user still needs Path A (or manual LaunchAgent
            registration) for auto-start. The artifact is the SAME `.dmg` either way — no fork.
