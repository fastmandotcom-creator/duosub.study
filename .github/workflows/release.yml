name: release

# Tag a version (git push origin v0.1.0) to build release binaries for every platform.
# install.sh downloads the assets attached to the GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The sherpa native crates need a recent SDK (apple-metal uses MTLLogState / MTLSampler-
          # ReductionMode), so the build must run on a macOS 26 image with Xcode 26+.
          - os: macos-26
            asset: duosub-bridge-macos-arm64.app.zip
            target: aarch64-apple-darwin
          - os: macos-26
            asset: duosub-bridge-macos-x64.app.zip
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install native build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config

      - name: Stamp the release tag as the package version (health reports the tag, not 0.1.0)
        if: runner.os == 'macOS'
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          if [ -n "$V" ] && [ "$V" != "0.1.0" ]; then
            sed -i.bak "s/^version = \"0\.1\.0\"/version = \"$V\"/" bridge/Cargo.toml
            rm -f bridge/Cargo.toml.bak
            grep '^version' bridge/Cargo.toml
          fi

      - name: Build
        working-directory: bridge
        env:
          DUOSUB_AUTODOWNLOAD: '1'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          # macOS attributes system-audio capture (ScreenCaptureKit) to the BUNDLE identity and
          # gates it behind TCC. A bare CLI binary has no bundle id, so it can never obtain the
          # Screen Recording grant — it would silently capture nothing. Therefore the release ships
          # a real .app bundle; the LaunchAgent runs the binary inside it.
          APP="dist/pkg/DuoSub Bridge.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp bridge/target/${{ matrix.target }}/release/duosub-bridge "$APP/Contents/MacOS/"
          find "$HOME/Library/Caches/sherpa-rs" -name 'libonnxruntime*.dylib' -exec cp {} "$APP/Contents/MacOS/" \; 2>/dev/null || true
          find "$HOME/Library/Caches/sherpa-rs" -name 'libsherpa-onnx-c-api.dylib' -exec cp {} "$APP/Contents/MacOS/" \; 2>/dev/null || true
          # @loader_path finds the bundled dylibs; /usr/lib/swift finds the system Swift runtime.
          install_name_tool -add_rpath @loader_path -add_rpath /usr/lib/swift "$APP/Contents/MacOS/duosub-bridge"
          for lib in "$APP/Contents/MacOS"/libonnxruntime*.dylib "$APP/Contents/MacOS"/libsherpa-onnx-c-api.dylib; do
            [ -e "$lib" ] || continue
            install_name_tool -id "$(basename "$lib")" "$lib" 2>/dev/null || true
          done
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>study.duosub.bridge</string>
            <key>CFBundleName</key><string>DuoSub Bridge</string>
            <key>CFBundleDisplayName</key><string>DuoSub Bridge</string>
            <key>CFBundleExecutable</key><string>duosub-bridge</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>LSUIElement</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>DuoSub Bridge transcribes audio on this Mac for on-device captions.</string>
            <key>NSScreenCaptureUsageDescription</key><string>DuoSub Bridge captures system audio so it can create live captions on this Mac.</string>
          </dict>
          </plist>
          PLIST
          # Ad-hoc-signing tax: a fresh binary is a fresh cdhash, so TCC treats every release as a
          # new app and the user re-grants Screen Recording. A Developer ID certificate removes
          # this (tracked TODO); until then the in-extension "Grant permission" button is the seam.
          codesign --force --deep --sign - --identifier study.duosub.bridge --timestamp=none "$APP"
          codesign -dv "$APP" 2>&1 | grep Identifier
          # HARD GATE: the ASR runtime dylibs MUST be bundled, else dyld refuses to load the binary
          # ("Library not loaded: libonnxruntime...") and the only user-visible symptom is a dead
          # bridge after install. System Swift/objc dylibs resolve via the /usr/lib/swift rpath we
          # added above — those are NOT bundled and are fine. So we assert exactly the two third-party
          # runtimes that the copy step above is responsible for providing.
          BINX="$APP/Contents/MacOS/duosub-bridge"
          MISSING=0
          for required in "libonnxruntime" "libsherpa-onnx-c-api"; do
            if ! ls "$APP/Contents/MacOS"/${required}*.dylib >/dev/null 2>&1; then
              echo "FATAL: $BINX needs ${required}*.dylib but it is not bundled" >&2
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "Bundle ASR-dependency check passed: $(ls "$APP/Contents/MacOS"/*.dylib 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"
          ditto -c -k --keepParent "$APP" dist/duosub-bridge-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x64' }}.app.zip
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The installer ships WITH the release: the script and the binaries it installs are always
      # the same version, served from immutable release assets (raw/main can be mid-push + cached).
      - run: mkdir -p assets && cp install.sh assets/install.sh

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**
          generate_release_notes: true
          body: |
            ## Install

            **macOS**
            ```bash
            curl -fsSL https://github.com/fastmandotcom-creator/duosub.study/releases/latest/download/install.sh | bash
            ```
